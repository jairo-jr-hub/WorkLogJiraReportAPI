<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jira Worklog Report</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Worklog Report</h2>
            <p>Integração Direta API</p>
        </div>

        <div class="form-group">
            <label>E-mail Atlassian</label>
            <input type="email" id="jiraEmail" class="form-control" value="jairo.junior@guaranisistemas.com.br">
        </div>
        <div class="form-group">
            <label>API Token</label>
            <input type="password" id="jiraToken" class="form-control" placeholder="Cole seu token aqui...">
        </div>
        
        <div class="divider"></div>

        <div class="form-group">
            <label>Data Inicial (De)</label>
            <input type="date" id="dateFrom" class="form-control">
        </div>
        <div class="form-group">
            <label>Data Final (Até)</label>
            <input type="date" id="dateTo" class="form-control">
        </div>

        <button id="btnGenerate" class="btn-primary">Buscar e Filtrar</button>
        
        <div id="statusMsg" class="status-msg"></div>
    </aside>

    <main class="main-content">
        <div class="group-by-section" id="groupBySection" style="display: none;">
            <div class="group-by-label">Group By</div>
            <div class="group-by-tags" id="groupByTags">
                <!-- As tags são renderizadas dinamicamente pelo JS -->
            </div>
            <select id="addGroupSelect" class="add-group-select">
                <option value="">+ Add field...</option>
            </select>
        </div>

        <div id="reportContainer" class="report-container">
            <div class="empty-msg">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#C1C7D0" stroke-width="1.5" style="margin-bottom:12px;">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <br>
                <b>Pronto para buscar</b><br>
                Insira seu token, ligue a extensão de CORS e clique em Filtrar.
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
