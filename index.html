<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jira Worklog Report</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Worklog Report</h2>
            <p>Export via Insomnia</p>
        </div>

        <div class="form-group">
            <label class="btn-load">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom:-3px; margin-right:4px;">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                </svg> Carregar JSON
                <input type="file" id="jsonFile" accept=".json" style="display: none;">
            </label>
            <div id="fileName" class="file-name">Nenhum arquivo selecionado</div>
        </div>
        
        <div class="divider"></div>

        <div class="form-group">
            <label>Data Inicial (De)</label>
            <input type="date" id="dateFrom" class="form-control">
        </div>
        <div class="form-group">
            <label>Data Final (Até)</label>
            <input type="date" id="dateTo" class="form-control">
        </div>

        <button id="btnGenerate" class="btn-primary">Filtrar Período</button>
    </aside>

    <main class="main-content">
        <div class="group-by-section" id="groupBySection" style="display: none;">
            <div class="group-by-label">Group By</div>
            <div class="group-by-tags" id="groupByTags">
                <!-- As tags são renderizadas dinamicamente pelo JS -->
            </div>
            <select id="addGroupSelect" class="add-group-select">
                <option value="">+ Add field...</option>
            </select>
        </div>

        <div id="reportContainer" class="report-container">
            <div class="empty-msg">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#C1C7D0" stroke-width="1.5" style="margin-bottom:12px;">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <br>
                <b>Nenhum dado carregado</b><br>
                Carregue o arquivo JSON no menu lateral para visualizar o relatório.
            </div>
        </div>
    </main>

    <!-- MODAL DE DETALHES DO WORKLOG -->
    <div id="worklogModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Worklogs</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <table class="modal-table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Início</th>
                            <th>Fim (aprox.)</th>
                            <th>Tempo</th>
                            <th>Comentário</th>
                        </tr>
                    </thead>
                    <tbody id="modalTableBody">
                        <!-- Preenchido via JS -->
                    </tbody>
                    <tfoot id="modalTableFoot">
                        <!-- Totalizador preenchido via JS -->
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
