<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jira Worklog Report</title>
    <link rel="stylesheet" href="style.css?v=6">
    <!-- Biblioteca SheetJS para exportação real em Excel (.xlsx) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Worklog Report</h2>
            <p>Integração direta Jira API</p>
        </div>

        <div class="form-group">
            <label>Usuário (Nome ou E-mail no Jira)</label>
            <div class="custom-select-wrapper" id="userSelectWrapper">
                <input type="text" id="jiraUser" class="form-control user-input" value="Jairo Antonio dos Santos Junior" placeholder="Digite ou selecione..." autocomplete="off">
                <button type="button" id="btnToggleUsers" class="select-chevron" title="Listar usuários">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div id="userDropdown" class="custom-dropdown"></div>
            </div>
        </div>

        <div class="form-group">
            <label>Data Inicial (De)</label>
            <input type="date" id="dateFrom" class="form-control">
        </div>
        <div class="form-group">
            <label>Data Final (Até)</label>
            <input type="date" id="dateTo" class="form-control">
        </div>

        <button type="button" id="btnFetchJira" class="btn-primary">Buscar do Jira</button>
        <button type="button" id="btnGenerate" class="btn-load" style="margin-top: 4px;">Refiltrar Dados Carregados</button>

        <div class="divider"></div>

        <div class="form-group">
            <label class="btn-load">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom:-3px; margin-right:4px;">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                </svg> Carregar JSON (Offline)
                <input type="file" id="jsonFile" accept=".json" style="display: none;">
            </label>
            <div id="fileName" class="file-name">Nenhum dado carregado</div>
        </div>
    </aside>

    <main class="main-content">
        <!-- CABEÇALHO DO RESPONSÁVEL + BOTÕES DE EXPORTAÇÃO -->
        <div id="reportHeader" class="report-header" style="display: none;"></div>

        <div class="group-by-section" id="groupBySection" style="display: none;">
            <div class="group-by-label">Group By</div>
            <div class="group-by-tags" id="groupByTags"></div>
            <select id="addGroupSelect" class="add-group-select">
                <option value="">+ Add field...</option>
            </select>
        </div>

        <div id="reportContainer" class="report-container">
            <div class="empty-msg">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#C1C7D0" stroke-width="1.5" style="margin-bottom:12px;">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <br>
                <b>Nenhum dado carregado</b><br>
                Escolha o usuário, o período e clique em <b>Buscar do Jira</b> (ou carregue um arquivo JSON).
            </div>
        </div>
    </main>

    <!-- MODAL DE DETALHES DO WORKLOG -->
    <div id="worklogModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div id="modalTitle" class="modal-title-container"></div>
                <span class="close-btn" onclick="closeModal()">×</span>
            </div>
            <div class="modal-body">
                <table class="modal-table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Início</th>
                            <th>Fim (aprox.)</th>
                            <th>Tempo</th>
                            <th>Comentário</th>
                        </tr>
                    </thead>
                    <tbody id="modalTableBody"></tbody>
                    <tfoot id="modalTableFoot"></tfoot>
                </table>
            </div>
        </div>
    </div>

    <!-- TOOLTIP CUSTOMIZADO (ESTILO JIRA) -->
    <div id="customTooltip" class="custom-tooltip"></div>

    <script src="script.js?v=6"></script>
</body>
</html>
